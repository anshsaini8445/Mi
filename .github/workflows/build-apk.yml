name: Build MICR APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Auto-Clean HTML & Inject All Missing Resources
        run: |
          # 1. पुरानी किसी भी HTML/Web फाइल को पूरी तरह हटाएँ
          rm -rf index.html assets app/src/main/assets package.json capacitor.config.json

          # 2. AndroidX सेटिंग्स सुनिश्चित करें
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          # 3. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # 4. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MICR"
          include ':app'
          EOF

          # 5. app/build.gradle (ZXing और Coroutines के साथ)
          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.ansh.micr'
              compileSdk 34

              defaultConfig {
                  applicationId "com.ansh.micr"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "2.4.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.cardview:cardview:1.0.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
              implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
          }
          EOF

          # 6. सारे कलर्स (AAPT एरर रोकने के लिए)
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg_dark">#070D18</color>
              <color name="card_dark">#0E1726</color>
              <color name="card_border">#1A273E</color>
              <color name="accent_green">#00D59B</color>
              <color name="accent_blue">#0084FF</color>
              <color name="text_white">#F8FAFC</color>
              <color name="text_muted">#8B9BB4</color>
          </resources>
          EOF

          # 7. थीम्स
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.MICR" parent="Theme.Material3.DayNight.NoActionBar">
                  <item name="android:windowBackground">@color/bg_dark</item>
                  <item name="android:statusBarColor">@color/bg_dark</item>
              </style>
          </resources>
          EOF

          # 8. स्ट्रिंग्स
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">MICR</string>
          </resources>
          EOF

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload MICR APK
        uses: actions/upload-artifact@v4
        with:
          name: MICR-v2.4-Turbo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
